[package]
name = "corvus-capture"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "CorvusCapture"
path = "src/main.rs"

[dependencies]
tray-icon = "0.24.2"
global-hotkey = "0.8.0"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
]

[build-dependencies]
embed-resource = "3.0.11"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
